[package]
name = "rust-smoke"
version = "0.0.0"
edition = "2021"

[dependencies]
# Keep this equal to rust-toolchain's libc-src version: Cargo path overrides
# are intentionally exact, so the smoke proves consumers use the locally
# patched crates.io source.
libc = "=0.2.189"

[profile.release]
panic = "abort"
