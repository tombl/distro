on:
  push:
    branches:
      - main
  pull_request:
  release:
    types:
      - published

jobs:
  list:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
      - uses: nixbuild/nix-quick-install-action@v34
      - uses: cachix/cachix-action@v17
        with:
          name: linuxwasm
          authToken: "${{secrets.CACHIX_AUTH_TOKEN}}"
      - name: List packages
        id: list
        run: |
          eval "$(nix print-dev-env .#ci)"
          matrix="$(nix-eval-jobs --flake .#checks.x86_64-linux --check-cache-status | jq -sc '
            [
              .[]
              | select(.isCached | not).attr
              | select(test("-shell$") | not)
            ]
            | if length > 0 then . else ["formatting"] end
          ')"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    needs: list
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        pkg: ${{ fromJson(needs.list.outputs.matrix) }}
    name: Build ${{ matrix.pkg }}
    steps:
      - uses: actions/checkout@v6
      - uses: nixbuild/nix-quick-install-action@v34
      - uses: cachix/cachix-action@v17
        with:
          name: linuxwasm
          authToken: "${{secrets.CACHIX_AUTH_TOKEN}}"
      - name: Build
        run: |
          eval "$(nix print-dev-env .#ci)"
          nix build '.#checks.x86_64-linux.${{ matrix.pkg }}^*' --print-build-logs

  packages:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: nixbuild/nix-quick-install-action@v34
      - uses: cachix/cachix-action@v17
        with:
          name: linuxwasm
          authToken: "${{secrets.CACHIX_AUTH_TOKEN}}"
      - name: Build npm packages
        run: |
          nix build .#linux --out-link result-linux --print-build-logs
          nix build .#linux-guest --out-link result-linux-guest --print-build-logs
          mkdir npm-packages
          cp -L result-linux/linux.tgz npm-packages/linux.tgz
          cp -L result-linux-guest/linux-guest.tgz npm-packages/linux-guest.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: npm-packages
          path: npm-packages/*.tgz
          if-no-files-found: error

  deploy-site:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == 'tombl/distro'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: nixbuild/nix-quick-install-action@v34
      - uses: cachix/cachix-action@v17
        with:
          name: linuxwasm
          authToken: "${{secrets.CACHIX_AUTH_TOKEN}}"
      - name: Build
        run: |
          eval "$(nix print-dev-env .#ci)"
          nix build .#site --print-build-logs
      - name: Deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: 7d87194d9d4af2959fb81de343dd63d9
          CLOUDFLARE_API_TOKEN: ${{secrets.CLOUDFLARE_API_TOKEN}}
          DEPLOY_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          nix develop .#ci --command wrangler pages deploy result/ \
            --project-name=linux \
            --branch="$DEPLOY_BRANCH"

  stage-npm:
    name: Stage ${{ matrix.name }} on npm
    needs:
      - build
      - packages
    if: github.event_name == 'release' && github.repository == 'tombl/linux'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "@tombl/linux"
            tarball: linux.tgz
          - name: "@tombl/linux-guest"
            tarball: linux-guest.tgz
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: npm-packages
          path: npm-packages
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@latest
      - name: Stage package
        env:
          NPM_TAG: ${{ github.event.release.prerelease && 'next' || 'latest' }}
        run: npm stage publish "./npm-packages/${{ matrix.tarball }}" --access public --tag "$NPM_TAG"
