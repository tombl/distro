on:
  push:
    branches:
      - main
  pull_request:
  release:
    types:
      - published

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@v6
      - uses: nixbuild/nix-quick-install-action@v35
      - uses: cachix/cachix-action@v17
        with:
          name: linuxwasm
          authToken: "${{secrets.CACHIX_AUTH_TOKEN}}"
      - name: Build checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          checks_file="$RUNNER_TEMP/checks.json"
          nix eval --json '.#checks.x86_64-linux' --apply '
            checks:
            builtins.mapAttrs (
              _: check:
              {
                drv = check.drvPath;
                outputs = map (output: (builtins.getAttr output check).outPath) check.outputs;
              }
            ) checks
          ' > "$checks_file"

          status() {
            gh api \
              --method POST \
              "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
              --field state="$2" \
              --field context="checks/$1" \
              --field description="$3" \
              --field target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
              >/dev/null
          }

          mapfile -t checks < <(jq --raw-output 'keys[]' "$checks_file")
          installables=()
          for check in "${checks[@]}"; do
            status "$check" pending "Build in progress"
            drv=$(jq --raw-output --arg check "$check" '.[$check].drv' "$checks_file")
            installables+=("$drv^*")
          done

          set +e
          nix build \
            --max-jobs auto \
            --keep-going \
            --no-link \
            --print-build-logs \
            "${installables[@]}"
          build_status=$?
          set -e

          for check in "${checks[@]}"; do
            mapfile -t outputs < <(
              jq --raw-output --arg check "$check" '.[$check].outputs[]' "$checks_file"
            )
            state=success
            description="Build passed"
            for output in "${outputs[@]}"; do
              if ! nix path-info "$output" >/dev/null 2>&1; then
                state=failure
                description="Build failed"
                break
              fi
            done
            status "$check" "$state" "$description"
          done

          exit "$build_status"
      - name: Build npm packages
        run: |
          nix build .#linux --out-link result-linux --print-build-logs
          nix build .#linux-guest --out-link result-linux-guest --print-build-logs
          mkdir npm-packages
          cp -L result-linux/linux.tgz npm-packages/linux.tgz
          cp -L result-linux-guest/linux-guest.tgz npm-packages/linux-guest.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: npm-packages
          path: npm-packages/*.tgz
          if-no-files-found: error

  deploy-bridge:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == 'tombl/distro'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: nixbuild/nix-quick-install-action@v35
      - uses: cachix/cachix-action@v17
        with:
          name: linuxwasm
          authToken: "${{secrets.CACHIX_AUTH_TOKEN}}"
      - name: Deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: 7d87194d9d4af2959fb81de343dd63d9
          CLOUDFLARE_API_TOKEN: ${{secrets.CLOUDFLARE_API_TOKEN}}
          DEPLOY_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          # TODO(tom): create this Pages project
          nix develop .#ci --command wrangler pages deploy packages/bridge-site/public \
            --project-name=linux-bridge \
            --branch="$DEPLOY_BRANCH"

  stage-npm:
    name: Stage packages on npm
    needs: build
    if: github.event_name == 'release' && github.repository == 'tombl/distro'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: npm-packages
          path: npm-packages
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@latest
      - name: Stage package
        env:
          NPM_TAG: ${{ github.event.release.prerelease && 'next' || 'latest' }}
        run: |
          npm stage publish ./npm-packages/linux.tgz --access public --tag "$NPM_TAG"
          npm stage publish ./npm-packages/linux-guest.tgz --access public --tag "$NPM_TAG"
