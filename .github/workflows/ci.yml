on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  # Manual runs only publish the trusted-publishing stubs (npm-trust-stub).
  workflow_dispatch:

# A new push to a pull request supersedes its older runs, which would otherwise
# keep building (and rebuilding uncached toolchains) for hours. Runs on main and
# tags each get their own group, so they are never cancelled or queued.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: Plan checks
    # Every other job depends on this one or on build, so manual runs build,
    # check and deploy nothing.
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      statuses: write
    outputs:
      heavy-checks: ${{ steps.plan.outputs.heavy-checks }}
    steps:
      - uses: actions/checkout@v6
      - uses: nixbuild/nix-quick-install-action@v35
      - id: plan
        name: Discover heavy checks
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          # Fork pull requests get a read-only token.
          POST_STATUSES: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          status() {
            [ "$POST_STATUSES" = true ] || return 0
            gh api \
              --method POST \
              "repos/$GITHUB_REPOSITORY/statuses/$STATUS_SHA" \
              --field state="$2" \
              --field context="checks/$1" \
              --field description="$3" \
              --field target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
              >/dev/null
          }

          # A check whose outputs are already in the binary cache passed on an
          # identical derivation, so it gets a status instead of a runner.
          outputs=$(nix eval --json '.#ciJobs.x86_64-linux.heavyChecks' --apply '
            builtins.mapAttrs (
              _: derivation:
              {
                drv = derivation.drvPath;
                outputs = map (output: (builtins.getAttr output derivation).outPath) derivation.outputs;
              }
            )
          ')

          pending=()
          while read -r check; do
            mapfile -t paths < <(jq --raw-output --arg check "$check" '.[$check].outputs[]' <<< "$outputs")
            if .github/ci/cached.sh "${paths[@]}"; then
              status "$check" success "Cached result"
            else
              pending+=("$check")
            fi
          done < <(jq --raw-output 'keys[]' <<< "$outputs")

          echo "${#pending[@]} of $(jq length <<< "$outputs") heavy checks need a runner"
          jq --compact-output '[$ARGS.positional[] as $check | {check: $check, drv: .[$check].drv}]' \
            --args -- "${pending[@]}" <<< "$outputs" > "$RUNNER_TEMP/heavy-checks.json"
          echo "heavy-checks=$(cat "$RUNNER_TEMP/heavy-checks.json")" >> "$GITHUB_OUTPUT"

          # Heavy jobs build these derivations directly. Fetching nixpkgs and
          # instantiating the flake again would cost each of them ~15s.
          mapfile -t drvs < <(jq --raw-output '.[].drv' "$RUNNER_TEMP/heavy-checks.json")
          mkdir -p "$RUNNER_TEMP/heavy-derivations"
          if [ "${#drvs[@]}" -gt 0 ]; then
            # --requisites lists dependencies first, the order --import needs.
            closure=$(nix-store --query --requisites "${drvs[@]}")
            mapfile -t closure <<< "$closure"
            set -o pipefail
            nix-store --export "${closure[@]}" |
              zstd --quiet -T0 > "$RUNNER_TEMP/heavy-derivations/derivations.nar.zst"
          fi
      - if: steps.plan.outputs.heavy-checks != '[]'
        uses: actions/upload-artifact@v4
        with:
          name: heavy-derivations
          path: ${{ runner.temp }}/heavy-derivations/derivations.nar.zst
          if-no-files-found: error
          # "Re-run failed jobs" reuses this run's plan for up to 30 days.
          retention-days: 30

  build:
    name: Build packages and checks
    needs: plan
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@v6
      - uses: nixbuild/nix-quick-install-action@v35
      - uses: cachix/cachix-action@v17
        with:
          name: linuxwasm
          authToken: "${{secrets.CACHIX_AUTH_TOKEN}}"
      - name: Build checks
        env:
          GH_TOKEN: ${{ github.token }}
          # On pull requests GITHUB_SHA is the synthetic merge commit, whose
          # statuses never appear on the pull request.
          STATUS_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          # Fork pull requests get a read-only token.
          POST_STATUSES: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          checks_file="$RUNNER_TEMP/checks.json"
          nix eval --json '.#ciJobs.x86_64-linux' --apply '
            jobs:
            let
              describe = builtins.mapAttrs (
                _: derivation:
                {
                  drv = derivation.drvPath;
                  # The stdenv packages have no outputs attribute.
                  outputs = map (output: (builtins.getAttr output derivation).outPath) (
                    derivation.outputs or [ "out" ]
                  );
                }
              );
            in
            {
              builds = describe jobs.builds;
              checks = describe jobs.checks;
            }
          ' > "$checks_file"

          status() {
            [ "$POST_STATUSES" = true ] || return 0
            gh api \
              --method POST \
              "repos/$GITHUB_REPOSITORY/statuses/$STATUS_SHA" \
              --field state="$2" \
              --field context="checks/$1" \
              --field description="$3" \
              --field target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
              >/dev/null
          }

          mapfile -t builds < <(jq --raw-output '.builds | keys[]' "$checks_file")
          mapfile -t checks < <(jq --raw-output '.checks | keys[]' "$checks_file")
          outputs() {
            jq --raw-output --arg kind "$1" --arg name "$2" '.[$kind][$name].outputs[]' "$checks_file"
          }

          # Cached outputs need neither a rebuild nor a download.
          installables=()
          for build in "${builds[@]}"; do
            mapfile -t paths < <(outputs builds "$build")
            if ! .github/ci/cached.sh "${paths[@]}"; then
              drv=$(jq --raw-output --arg build "$build" '.builds[$build].drv' "$checks_file")
              installables+=("$drv^*")
            fi
          done
          declare -A cached_checks=()
          for check in "${checks[@]}"; do
            mapfile -t paths < <(outputs checks "$check")
            if .github/ci/cached.sh "${paths[@]}"; then
              cached_checks[$check]=1
              status "$check" success "Cached result"
            else
              status "$check" pending "Build in progress"
              drv=$(jq --raw-output --arg check "$check" '.checks[$check].drv' "$checks_file")
              installables+=("$drv^*")
            fi
          done
          echo "${#installables[@]} of $((${#builds[@]} + ${#checks[@]})) builds and checks are not cached"

          build_status=0
          if [ "${#installables[@]}" -gt 0 ]; then
            set +e
            nix build \
              --max-jobs auto \
              --keep-going \
              --no-link \
              --print-build-logs \
              "${installables[@]}"
            build_status=$?
            set -e
          fi

          for check in "${checks[@]}"; do
            [ -z "${cached_checks[$check]:-}" ] || continue
            mapfile -t paths < <(outputs checks "$check")
            state=success
            description="Build passed"
            for output in "${paths[@]}"; do
              if ! nix path-info "$output" >/dev/null 2>&1; then
                state=failure
                description="Build failed"
                break
              fi
            done
            status "$check" "$state" "$description"
          done

          exit "$build_status"
      - name: Build npm packages
        # One archive per published package (scripts/packages.mjs).
        run: |
          archives=$(nix build .#npm-packages --no-link --print-out-paths --print-build-logs)
          cp -RL "$archives" npm-packages
      - uses: actions/upload-artifact@v4
        with:
          name: npm-packages
          path: npm-packages/*.tgz
          if-no-files-found: error

  heavy-check:
    name: Heavy check / ${{ matrix.check }}
    needs:
      - plan
      - build
    if: needs.plan.outputs.heavy-checks != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.heavy-checks) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: nixbuild/nix-quick-install-action@v35
      - uses: cachix/cachix-action@v17
        with:
          name: linuxwasm
          authToken: "${{secrets.CACHIX_AUTH_TOKEN}}"
      - uses: actions/download-artifact@v4
        with:
          name: heavy-derivations
          path: ${{ runner.temp }}/heavy-derivations
      - name: Build isolated check
        env:
          DRV: ${{ matrix.drv }}
        run: |
          zstd --decompress --stdout "$RUNNER_TEMP/heavy-derivations/derivations.nar.zst" |
            nix-store --import >/dev/null
          nix build --no-link --print-build-logs "$DRV^*"

  deploy-site:
    name: Deploy site
    needs:
      - build
      - heavy-check
    # heavy-check is skipped when every heavy check is cached.
    if: >-
      !cancelled() && needs.build.result == 'success' && (needs.heavy-check.result == 'success' || needs.heavy-check.result == 'skipped') &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'tombl/distro') ||
      github.event.pull_request.head.repo.full_name == 'tombl/distro')
    # Production publishes prune the apk repository against its live index, so
    # they must not interleave; a newer push to a pull request replaces its
    # preview instead. The group gives mutual exclusion, not ordering, so the
    # deploy steps also check that this run is still its branch's or pull
    # request's head. The default queue keeps one pending job, so an older run
    # arriving late would cancel main's pending deploy and then skip itself;
    # queue: max keeps every waiting job.
    concurrency:
      group: ${{ github.event_name == 'push' && 'deploy-site-production' || format('deploy-site-{0}', github.event.pull_request.number) }}
      cancel-in-progress: ${{ github.event_name != 'push' }}
      queue: max
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      deployments: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
      - uses: nixbuild/nix-quick-install-action@v35
      - uses: cachix/cachix-action@v17
        with:
          name: linuxwasm
          authToken: "${{secrets.CACHIX_AUTH_TOKEN}}"
      - name: Check the commit is still current
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .github/scripts/is-current.sh \
            "${{ github.event.pull_request.head.sha || github.sha }}" \
            "${{ github.event.pull_request.number }}"
      - name: Publish apk repository
        if: steps.current.outputs.current == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'tombl/distro'
        env:
          APK_SIGNING_KEY: ${{secrets.APK_SIGNING_KEY}}
          CLOUDFLARE_API_TOKEN: ${{secrets.CLOUDFLARE_API_TOKEN}}
          R2_BUCKET: ${{secrets.R2_BUCKET}}
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{secrets.R2_ACCESS_KEY_ID}}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{secrets.R2_SECRET_ACCESS_KEY}}
          RCLONE_CONFIG_R2_ENDPOINT: "https://7d87194d9d4af2959fb81de343dd63d9.r2.cloudflarestorage.com"
        run: |
          distro/site/scripts/publish-apk-repo.sh
      - name: Deploy production
        if: steps.current.outputs.current == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'tombl/distro'
        env:
          CLOUDFLARE_API_TOKEN: ${{secrets.CLOUDFLARE_API_TOKEN}}
          GH_TOKEN: ${{ github.token }}
        run: |
          nix run .#wrangler-deploy
          .github/scripts/record-deployment.sh site "https://low.land" "Site" production
      - name: Deploy preview
        if: steps.current.outputs.current == 'true' && github.event_name == 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{secrets.CLOUDFLARE_API_TOKEN}}
          GH_TOKEN: ${{ github.token }}
        run: |
          output=$(nix run .#wrangler-preview -- \
            --preview-alias "pr-${{ github.event.pull_request.number }}" \
            --message "PR #${{ github.event.pull_request.number }} at ${GITHUB_SHA}" 2>&1 | tee /dev/stderr)
          preview_url=$(printf '%s\n' "$output" | grep -Eo \
            'https://pr-${{ github.event.pull_request.number }}-linux\.[[:alnum:]-]+\.workers\.dev' | tail -1)
          if [ -z "$preview_url" ]; then
            echo "Wrangler did not return the expected site preview URL" >&2
            exit 1
          fi
          {
            echo "### Site preview"
            printf '[Open the site preview](%s)\n' "$preview_url"
          } >> "$GITHUB_STEP_SUMMARY"
          .github/scripts/record-deployment.sh \
            "preview-site-pr-${{ github.event.pull_request.number }}" "$preview_url" \
            "Site preview" preview \
            "${{ github.event.pull_request.head.sha }}"

  deploy-docs:
    name: Deploy docs
    needs:
      - build
      - heavy-check
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'tombl/distro') || github.event.pull_request.head.repo.full_name == 'tombl/distro'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      deployments: write
      pull-requests: read
    concurrency:
      group: deploy-docs-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
      - uses: nixbuild/nix-quick-install-action@v35
      - uses: cachix/cachix-action@v17
        with:
          name: linuxwasm
          authToken: "${{secrets.CACHIX_AUTH_TOKEN}}"
      - name: Check the commit is still current
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .github/scripts/is-current.sh \
            "${{ github.event.pull_request.head.sha || github.sha }}" \
            "${{ github.event.pull_request.number }}"
      - name: Deploy production
        if: steps.current.outputs.current == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'tombl/distro'
        env:
          CLOUDFLARE_API_TOKEN: ${{secrets.CLOUDFLARE_API_TOKEN}}
          GH_TOKEN: ${{ github.token }}
        run: |
          nix run .#docs-wrangler-deploy
          .github/scripts/record-deployment.sh \
            docs "https://docs.low.land" "Docs" production
      - name: Deploy preview
        if: steps.current.outputs.current == 'true' && github.event_name == 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{secrets.CLOUDFLARE_API_TOKEN}}
          GH_TOKEN: ${{ github.token }}
        run: |
          output=$(nix run .#docs-wrangler-preview -- \
            --preview-alias "docs-pr-${{ github.event.pull_request.number }}" \
            --message "Docs for PR #${{ github.event.pull_request.number }} at ${GITHUB_SHA}" 2>&1 | tee /dev/stderr)
          preview_url=$(printf '%s\n' "$output" | grep -Eo \
            'https://docs-pr-${{ github.event.pull_request.number }}-lowland-docs\.[[:alnum:]-]+\.workers\.dev' | tail -1)
          if [ -z "$preview_url" ]; then
            echo "Wrangler did not return the expected docs preview URL" >&2
            exit 1
          fi
          {
            echo "### Docs preview"
            printf '[Open the docs preview](%s)\n' "$preview_url"
          } >> "$GITHUB_STEP_SUMMARY"
          .github/scripts/record-deployment.sh \
            "preview-docs-pr-${{ github.event.pull_request.number }}" "$preview_url" \
            "Docs preview" preview \
            "${{ github.event.pull_request.head.sha }}"

  # The release job's validation and publishing, run as a dry run on every
  # push, so a tag finds no surprises in the archives or the release metadata.
  release-dry-run:
    name: Release dry run
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: npm-packages
          path: npm-packages
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11.16.0
      - name: Validate and publish (dry run)
        run: |
          set -euo pipefail
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            directory=$(node scripts/packages.mjs | jq --raw-output '.[0].directory')
            version=$(jq --raw-output .version "$directory/package.json")
          fi

          # Before a release commit, preview the notes from [Unreleased].
          if grep --quiet "^## \[$version\] - " CHANGELOG.md; then
            node scripts/release-notes.mjs "$version" > release-notes.md
          else
            node scripts/release-notes.mjs "$version" --unreleased > release-notes.md
          fi
          node scripts/publish.mjs "$version" npm-packages --dry-run

          {
            echo "### Release dry run for $version"
            echo
            echo "Would publish, in order: $(node scripts/packages.mjs | jq --raw-output 'map(.name) | join(", ")')."
            echo "Would attach to the GitHub release: $(cd npm-packages && echo *.tgz)."
            echo
            cat release-notes.md
          } >> "$GITHUB_STEP_SUMMARY"

  publish-release:
    name: Publish npm packages and GitHub release
    needs:
      - build
      - heavy-check
      - release-dry-run
    if: >-
      !cancelled() && needs.build.result == 'success' && (needs.heavy-check.result == 'success' || needs.heavy-check.result == 'skipped') &&
      needs.release-dry-run.result == 'success' &&
      github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.repository == 'tombl/distro'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: npm-packages
          path: npm-packages
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11.16.0
      - name: Release notes
        run: node scripts/release-notes.mjs "${GITHUB_REF_NAME#v}" > release-notes.md
      - name: Publish packages
        env:
          NPM_CONFIG_PROVENANCE: true
        run: node scripts/publish.mjs "${GITHUB_REF_NAME#v}" npm-packages
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "$GITHUB_REF_NAME already has a GitHub release"
            gh release upload "$GITHUB_REF_NAME" npm-packages/*.tgz --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --title "$GITHUB_REF_NAME" \
              --notes-file release-notes.md \
              npm-packages/*.tgz
          fi

  # npm drops a trusted-publisher configuration that has not published within
  # 48 hours of being created. Dispatching this workflow on main publishes a
  # placeholder of each package under the trust dist-tag, leaving latest alone.
  npm-trust-stub:
    name: Publish trusted-publishing stubs
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'tombl/distro'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11.16.0
      - name: Publish stubs
        env:
          VERSION: 0.0.0-trust.${{ github.run_number }}
        run: |
          set -uo pipefail
          summary=()
          failed=0

          mapfile -t packages < <(node scripts/packages.mjs | jq --raw-output '.[].name')
          for package in "${packages[@]}"; do
            if npm view "${package}@${VERSION}" version >/dev/null 2>&1; then
              summary+=("${package}@${VERSION}: already published")
              continue
            fi

            dir="$RUNNER_TEMP/stubs/${package//\//-}"
            mkdir -p "$dir"
            jq --null-input --arg name "$package" --arg version "$VERSION" '{
              name: $name,
              version: $version,
              description: "Trusted-publishing placeholder; not a release.",
              license: "MIT",
              repository: {type: "git", url: "git+https://github.com/tombl/distro.git"}
            }' > "$dir/package.json"
            echo "Placeholder for npm trusted publishing; not a release." > "$dir/README.md"

            if output=$(npm publish "$dir" --provenance --access public --tag trust 2>&1); then
              printf '%s\n' "$output"
              summary+=("${package}@${VERSION}: published")
            else
              printf '%s\n' "$output"
              failed=1
              if grep -Eq 'E40[34]|\b40[34]\b' <<< "$output"; then
                summary+=("${package}: FAILED with 403/404, likely no trusted publisher for tombl/distro ci.yml")
              else
                summary+=("${package}: FAILED, see the log above")
              fi
            fi
          done

          {
            echo "### npm trusted-publishing stubs"
            printf -- '- %s\n' "${summary[@]}"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit "$failed"
