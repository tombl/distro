on:
  push:
    branches:
      - main
  pull_request:
  release:
    types:
      - published

jobs:
  eval:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      any-jobs: ${{ steps.matrix.outputs.any-jobs }}
      manifest-version: ${{ steps.matrix.outputs.manifest-version }}
    steps:
      - uses: actions/checkout@v6
      - uses: NixOS/nix-installer-action@main
      - uses: cachix/cachix-action@v17
        with:
          name: linuxwasm
          authToken: "${{secrets.CACHIX_AUTH_TOKEN}}"
      - uses: Mic92/hestia@main
      - id: matrix
        uses: Mic92/hestia/matrix@main
        with:
          nix-eval-jobs: "nix run nixpkgs#nix-eval-jobs --inputs-from . --"

  build:
    needs: eval
    if: needs.eval.outputs.any-jobs == 'true'
    name: ${{ matrix.name }} (${{ matrix.system }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.eval.outputs.matrix) }}
    steps:
      - uses: NixOS/nix-installer-action@main
      - uses: cachix/cachix-action@v17
        with:
          name: linuxwasm
          authToken: "${{secrets.CACHIX_AUTH_TOKEN}}"
      - uses: Mic92/hestia@main
        with:
          wait-manifest-version: ${{ needs.eval.outputs.manifest-version }}
      - name: Prefetch drv closure
        run: |
          hashes=$(printf '%s\n' ${{ matrix.installables }} |
            awk -F/ '{printf "%s%s", (NR > 1 ? "," : ""), substr($NF, 1, 32)}')
          curl -fsS "http://$HESTIA_LISTEN/closure/$hashes" | nix-store --import
      - run: nix build -L ${{ matrix.installables }}

  packages:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: NixOS/nix-installer-action@main
      - uses: cachix/cachix-action@v17
        with:
          name: linuxwasm
          authToken: "${{secrets.CACHIX_AUTH_TOKEN}}"
      - name: Build npm packages
        run: |
          nix build .#linux --out-link result-linux --print-build-logs
          nix build .#linux-guest --out-link result-linux-guest --print-build-logs
          mkdir npm-packages
          cp -L result-linux/linux.tgz npm-packages/linux.tgz
          cp -L result-linux-guest/linux-guest.tgz npm-packages/linux-guest.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: npm-packages
          path: npm-packages/*.tgz
          if-no-files-found: error

  stage-npm:
    name: Stage ${{ matrix.name }} on npm
    needs:
      - build
      - packages
    if: github.event_name == 'release' && github.repository == 'tombl/distro'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "@tombl/linux"
            tarball: linux.tgz
          - name: "@tombl/linux-guest"
            tarball: linux-guest.tgz
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: npm-packages
          path: npm-packages
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@latest
      - name: Stage package
        env:
          NPM_TAG: ${{ github.event.release.prerelease && 'next' || 'latest' }}
        run: npm stage publish "./npm-packages/${{ matrix.tarball }}" --access public --tag "$NPM_TAG"
