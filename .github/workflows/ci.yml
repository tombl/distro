on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:

# A new push to a pull request supersedes its older runs, which would otherwise
# keep building (and rebuilding uncached toolchains) for hours. Runs on main and
# tags each get their own group, so they are never cancelled or queued.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: Plan checks
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      statuses: write
    outputs:
      heavy-checks: ${{ steps.plan.outputs.heavy-checks }}
    steps:
      - uses: actions/checkout@v6
      - uses: nixbuild/nix-quick-install-action@v35
      - id: plan
        name: Discover heavy checks
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          # Fork pull requests get a read-only token.
          POST_STATUSES: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          status() {
            [ "$POST_STATUSES" = true ] || return 0
            gh api \
              --method POST \
              "repos/$GITHUB_REPOSITORY/statuses/$STATUS_SHA" \
              --field state="$2" \
              --field context="checks/$1" \
              --field description="$3" \
              --field target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
              >/dev/null
          }

          # A check whose outputs are already in the binary cache passed on an
          # identical derivation, so it gets a status instead of a runner.
          outputs=$(nix eval --json '.#ciJobs.x86_64-linux.heavyChecks' --apply '
            builtins.mapAttrs (
              _: derivation:
              {
                drv = derivation.drvPath;
                outputs = map (output: (builtins.getAttr output derivation).outPath) derivation.outputs;
              }
            )
          ')

          pending=()
          while read -r check; do
            mapfile -t paths < <(jq --raw-output --arg check "$check" '.[$check].outputs[]' <<< "$outputs")
            if .github/ci/cached.sh "${paths[@]}"; then
              status "$check" success "Cached result"
            else
              pending+=("$check")
            fi
          done < <(jq --raw-output 'keys[]' <<< "$outputs")

          echo "${#pending[@]} of $(jq length <<< "$outputs") heavy checks need a runner"
          jq --compact-output '[$ARGS.positional[] as $check | {check: $check, drv: .[$check].drv}]' \
            --args -- "${pending[@]}" <<< "$outputs" > "$RUNNER_TEMP/heavy-checks.json"
          echo "heavy-checks=$(cat "$RUNNER_TEMP/heavy-checks.json")" >> "$GITHUB_OUTPUT"

          # Heavy jobs build these derivations directly. Fetching nixpkgs and
          # instantiating the flake again would cost each of them ~15s.
          mapfile -t drvs < <(jq --raw-output '.[].drv' "$RUNNER_TEMP/heavy-checks.json")
          mkdir -p "$RUNNER_TEMP/heavy-derivations"
          if [ "${#drvs[@]}" -gt 0 ]; then
            # --requisites lists dependencies first, the order --import needs.
            closure=$(nix-store --query --requisites "${drvs[@]}")
            mapfile -t closure <<< "$closure"
            set -o pipefail
            nix-store --export "${closure[@]}" |
              zstd --quiet -T0 > "$RUNNER_TEMP/heavy-derivations/derivations.nar.zst"
          fi
      - if: steps.plan.outputs.heavy-checks != '[]'
        uses: actions/upload-artifact@v4
        with:
          name: heavy-derivations
          path: ${{ runner.temp }}/heavy-derivations/derivations.nar.zst
          if-no-files-found: error
          # "Re-run failed jobs" reuses this run's plan for up to 30 days.
          retention-days: 30

  build:
    name: Build packages and checks
    needs: plan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@v6
      - uses: nixbuild/nix-quick-install-action@v35
      - uses: cachix/cachix-action@v17
        with:
          name: linuxwasm
          authToken: "${{secrets.CACHIX_AUTH_TOKEN}}"
      - name: Build checks
        env:
          GH_TOKEN: ${{ github.token }}
          # On pull requests GITHUB_SHA is the synthetic merge commit, whose
          # statuses never appear on the pull request.
          STATUS_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          # Fork pull requests get a read-only token.
          POST_STATUSES: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          checks_file="$RUNNER_TEMP/checks.json"
          nix eval --json '.#ciJobs.x86_64-linux' --apply '
            jobs:
            let
              describe = builtins.mapAttrs (
                _: derivation:
                {
                  drv = derivation.drvPath;
                  # The stdenv packages have no outputs attribute.
                  outputs = map (output: (builtins.getAttr output derivation).outPath) (
                    derivation.outputs or [ "out" ]
                  );
                }
              );
            in
            {
              builds = describe jobs.builds;
              checks = describe jobs.checks;
            }
          ' > "$checks_file"

          status() {
            [ "$POST_STATUSES" = true ] || return 0
            gh api \
              --method POST \
              "repos/$GITHUB_REPOSITORY/statuses/$STATUS_SHA" \
              --field state="$2" \
              --field context="checks/$1" \
              --field description="$3" \
              --field target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
              >/dev/null
          }

          mapfile -t builds < <(jq --raw-output '.builds | keys[]' "$checks_file")
          mapfile -t checks < <(jq --raw-output '.checks | keys[]' "$checks_file")
          outputs() {
            jq --raw-output --arg kind "$1" --arg name "$2" '.[$kind][$name].outputs[]' "$checks_file"
          }

          # Cached outputs need neither a rebuild nor a download.
          installables=()
          for build in "${builds[@]}"; do
            mapfile -t paths < <(outputs builds "$build")
            if ! .github/ci/cached.sh "${paths[@]}"; then
              drv=$(jq --raw-output --arg build "$build" '.builds[$build].drv' "$checks_file")
              installables+=("$drv^*")
            fi
          done
          declare -A cached_checks=()
          for check in "${checks[@]}"; do
            mapfile -t paths < <(outputs checks "$check")
            if .github/ci/cached.sh "${paths[@]}"; then
              cached_checks[$check]=1
              status "$check" success "Cached result"
            else
              status "$check" pending "Build in progress"
              drv=$(jq --raw-output --arg check "$check" '.checks[$check].drv' "$checks_file")
              installables+=("$drv^*")
            fi
          done
          echo "${#installables[@]} of $((${#builds[@]} + ${#checks[@]})) builds and checks are not cached"

          build_status=0
          if [ "${#installables[@]}" -gt 0 ]; then
            set +e
            nix build \
              --max-jobs auto \
              --keep-going \
              --no-link \
              --print-build-logs \
              "${installables[@]}"
            build_status=$?
            set -e
          fi

          for check in "${checks[@]}"; do
            [ -z "${cached_checks[$check]:-}" ] || continue
            mapfile -t paths < <(outputs checks "$check")
            state=success
            description="Build passed"
            for output in "${paths[@]}"; do
              if ! nix path-info "$output" >/dev/null 2>&1; then
                state=failure
                description="Build failed"
                break
              fi
            done
            status "$check" "$state" "$description"
          done

          exit "$build_status"
      - name: Build npm packages
        run: |
          nix build .#kernel --out-link result-kernel --print-build-logs
          nix build .#linux-guest --out-link result-linux-guest --print-build-logs
          mkdir npm-packages
          cp -L result-kernel/package.tgz npm-packages/kernel.tgz
          cp -L result-linux-guest/package.tgz npm-packages/linux-guest.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: npm-packages
          path: npm-packages/*.tgz
          if-no-files-found: error

  heavy-check:
    name: Heavy check / ${{ matrix.check }}
    needs:
      - plan
      - build
    if: needs.plan.outputs.heavy-checks != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.heavy-checks) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: nixbuild/nix-quick-install-action@v35
      - uses: cachix/cachix-action@v17
        with:
          name: linuxwasm
          authToken: "${{secrets.CACHIX_AUTH_TOKEN}}"
      - uses: actions/download-artifact@v4
        with:
          name: heavy-derivations
          path: ${{ runner.temp }}/heavy-derivations
      - name: Build isolated check
        env:
          DRV: ${{ matrix.drv }}
        run: |
          zstd --decompress --stdout "$RUNNER_TEMP/heavy-derivations/derivations.nar.zst" |
            nix-store --import >/dev/null
          nix build --no-link --print-build-logs "$DRV^*"

  deploy-site:
    name: Deploy site
    needs:
      - build
      - heavy-check
    # heavy-check is skipped when every heavy check is cached.
    if: >-
      !cancelled() && needs.build.result == 'success' && (needs.heavy-check.result == 'success' || needs.heavy-check.result == 'skipped') &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'tombl/distro') ||
      github.event.pull_request.head.repo.full_name == 'tombl/distro')
    # Production publishes prune the apk repository against its live index, so
    # they must not interleave. Previews stay independent. The group gives
    # mutual exclusion, not ordering, so production steps also check that this
    # run is still main's head.
    concurrency:
      group: ${{ github.event_name == 'push' && 'deploy-site-production' || format('deploy-site-{0}', github.run_id) }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: nixbuild/nix-quick-install-action@v35
      - uses: cachix/cachix-action@v17
        with:
          name: linuxwasm
          authToken: "${{secrets.CACHIX_AUTH_TOKEN}}"
      # A slower run for an older commit, or a rerun of one, must not replace
      # what a newer commit published. If main has moved on, its own run
      # deploys instead.
      - name: Check production is current
        id: production
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'tombl/distro'
        run: |
          head=$(git ls-remote --exit-code origin refs/heads/main | cut -f1)
          if [ "$head" = "$GITHUB_SHA" ]; then
            echo current=true >>"$GITHUB_OUTPUT"
          else
            echo "::notice::main is now at $head; skipping the deploy of $GITHUB_SHA"
          fi
      - name: Publish apk repository
        if: steps.production.outputs.current == 'true'
        env:
          APK_SIGNING_KEY: ${{secrets.APK_SIGNING_KEY}}
          CLOUDFLARE_API_TOKEN: ${{secrets.CLOUDFLARE_API_TOKEN}}
          R2_BUCKET: ${{secrets.R2_BUCKET}}
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{secrets.R2_ACCESS_KEY_ID}}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{secrets.R2_SECRET_ACCESS_KEY}}
          RCLONE_CONFIG_R2_ENDPOINT: "https://7d87194d9d4af2959fb81de343dd63d9.r2.cloudflarestorage.com"
        run: |
          distro/site/scripts/publish-apk-repo.sh
      - name: Deploy production
        if: steps.production.outputs.current == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{secrets.CLOUDFLARE_API_TOKEN}}
        run: |
          nix run .#wrangler-deploy
      - name: Deploy preview
        if: github.event_name == 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{secrets.CLOUDFLARE_API_TOKEN}}
        run: |
          output=$(nix run .#wrangler-preview -- \
            --preview-alias "pr-${{ github.event.pull_request.number }}" \
            --message "PR #${{ github.event.pull_request.number }} at ${GITHUB_SHA}" 2>&1 | tee /dev/stderr)
          {
            echo "### Site preview"
            printf '%s\n' "$output" | grep -Eo 'https://[^[:space:]]+' | tail -1
          } >> "$GITHUB_STEP_SUMMARY"

  publish-release:
    name: Publish npm packages and GitHub release
    needs:
      - build
      - heavy-check
    if: >-
      !cancelled() && needs.build.result == 'success' && (needs.heavy-check.result == 'success' || needs.heavy-check.result == 'skipped') &&
      github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.repository == 'tombl/distro'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: npm-packages
          path: npm-packages
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11.16.0
      - name: Validate release metadata
        run: |
          version="${GITHUB_REF_NAME#v}"
          test "$(jq --raw-output .version packages/bytes/package.json)" = "$version"
          test "$(jq --raw-output .version packages/kernel/package.json)" = "$version"
          test "$(jq --raw-output .version packages/linux-guest/package.json)" = "$version"
          test "$(jq --raw-output .version packages/runner/package.json)" = "$version"
          node scripts/release-notes.mjs "$version" > release-notes.md
      - name: Publish packages
        env:
          NPM_CONFIG_PROVENANCE: true
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"

          publish() {
            package="$1"
            archive="$2"
            if npm view "${package}@${version}" version >/dev/null 2>&1; then
              echo "${package}@${version} is already published"
            else
              npm publish "$archive" --access public
            fi
          }

          publish @lowland/kernel ./npm-packages/kernel.tgz
          publish @lowland/guest ./npm-packages/linux-guest.tgz
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "$GITHUB_REF_NAME already has a GitHub release"
          else
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --title "$GITHUB_REF_NAME" \
              --notes-file release-notes.md
          fi
