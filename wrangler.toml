# The site is a static site on Workers Static Assets: no Worker script, just
# the assets directory. _headers in that directory applies the cross-origin
# isolation headers the guest needs.
name = "linux"
compatibility_date = "2026-08-07"

[assets]
directory = "deploy"

# Production serves on low.land (and www). Requires the zone on Cloudflare.
[[routes]]
pattern = "low.land"
custom_domain = true

[[routes]]
pattern = "www.low.land"
custom_domain = true

# Pull requests deploy to the preview environment instead, so branch builds
# get a stable workers.dev URL without claiming the production custom domain
# or overwriting production.
[env.preview]
name = "linux-preview"
routes = []
workers_dev = true
